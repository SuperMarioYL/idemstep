<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" data-palette="d556e6-e76ab3-d2acf6-3215de920bc7" role="img" aria-labelledby="integrations-light-title integrations-light-desc"><title id="integrations-light-title">IdemStep integration routes</title><desc id="integrations-light-desc">Supported input and output routes</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="600"><stop stop-color="#ac45b9"/><stop offset=".6" stop-color="#ae5087"/><stop offset="1" stop-color="#7e6894"/></linearGradient><radialGradient id="halo"><stop stop-color="#ac45b9" stop-opacity=".22"/><stop offset="1" stop-color="#fef9fe" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f3cbf7" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#ac45b9" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="600" rx="16" fill="#fef9fe"/><rect width="1000" height="600" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="258.0" rx="500.0" ry="420.0" fill="url(#halo)"/><text x="44" y="44" fill="#6f5e88" font-size="13" text-anchor="start" font-weight="400">CAPABILITIES / CONNECTIONS</text><text x="44" y="84.0" fill="#251630" font-size="30" text-anchor="start" font-weight="400">Supported input and output routes</text><ellipse cx="500" cy="337" rx="238" ry="176" fill="none" stroke="#f3cbf7"/><ellipse cx="500" cy="337" rx="193" ry="144" fill="none" stroke="#f3cbf7" stroke-dasharray="2 9"/><circle cx="500" cy="337" r="68" fill="#fdf7fe" stroke="#ac45b9"/><text x="500" y="348" fill="#ac45b9" font-size="34" text-anchor="middle" font-weight="700">ID</text><path d="M276 211H390V337H432" fill="none" stroke="#ac45b9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M276 211H390V337H432" class="flow" fill="none" stroke="#7e6894" stroke-width="2"/><rect x="40" y="156" width="236" height="112" rx="12" fill="#fdf7fe" stroke="#f3cbf7"/><text x="58" y="187.0" fill="#251630" font-size="21" text-anchor="start" font-weight="400">JavaScript</text><text x="58" y="239.0" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">idemStep wrapper</text><path d="M568 337H662V211H724" fill="none" stroke="#ac45b9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M568 337H662V211H724" class="flow" fill="none" stroke="#7e6894" stroke-width="2"/><rect x="724" y="156" width="236" height="112" rx="12" fill="#fdf7fe" stroke="#f3cbf7"/><text x="742" y="187.0" fill="#251630" font-size="21" text-anchor="start" font-weight="400">HTTP proxy</text><text x="742" y="239.0" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">x-idem-key request</text><text x="742" y="262.8" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">routing</text><path d="M276 357H390V337H432" fill="none" stroke="#ac45b9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M276 357H390V337H432" class="flow" fill="none" stroke="#7e6894" stroke-width="2"/><rect x="40" y="302" width="236" height="112" rx="12" fill="#fdf7fe" stroke="#f3cbf7"/><text x="58" y="333.0" fill="#251630" font-size="21" text-anchor="start" font-weight="400">Playwright</text><text x="58" y="385.0" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">explicit proxy and</text><text x="58" y="408.8" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">headers</text><path d="M568 337H662V357H724" fill="none" stroke="#ac45b9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M568 337H662V357H724" class="flow" fill="none" stroke="#7e6894" stroke-width="2"/><rect x="724" y="302" width="236" height="112" rx="12" fill="#fdf7fe" stroke="#f3cbf7"/><text x="742" y="333.0" fill="#251630" font-size="21" text-anchor="start" font-weight="400">JSON file</text><text x="742" y="385.0" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">completed-record</text><text x="742" y="408.8" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">persistence</text><path d="M276 503H390V337H432" fill="none" stroke="#ac45b9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M276 503H390V337H432" class="flow" fill="none" stroke="#7e6894" stroke-width="2"/><rect x="40" y="448" width="236" height="112" rx="12" fill="#fdf7fe" stroke="#f3cbf7"/><text x="58" y="479.0" fill="#251630" font-size="21" text-anchor="start" font-weight="400">HTTPS CONNECT</text><text x="58" y="531.0" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">optional local CA</text><text x="58" y="554.8" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">interception</text></svg>
