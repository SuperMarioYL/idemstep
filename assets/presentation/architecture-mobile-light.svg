<svg xmlns="http://www.w3.org/2000/svg" width="400" height="730" viewBox="0 0 400 730" data-palette="d556e6-e76ab3-d2acf6-3215de920bc7" role="img" aria-labelledby="architecture-mobile-light-title architecture-mobile-light-desc"><title id="architecture-mobile-light-title">IdemStep architecture</title><desc id="architecture-mobile-light-desc">One key joins the step, store and proxy</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="400" y2="730"><stop stop-color="#ac45b9"/><stop offset=".6" stop-color="#ae5087"/><stop offset="1" stop-color="#7e6894"/></linearGradient><radialGradient id="halo"><stop stop-color="#ac45b9" stop-opacity=".22"/><stop offset="1" stop-color="#fef9fe" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f3cbf7" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#ac45b9" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="400" height="730" rx="16" fill="#fef9fe"/><rect width="400" height="730" rx="16" fill="url(#grid)"/><ellipse cx="252.0" cy="313.9" rx="200.0" ry="510.99999999999994" fill="url(#halo)"/><text x="28" y="44" fill="#6f5e88" font-size="13" text-anchor="start" font-weight="400">ARCHITECTURE / DATA FLOW</text><text x="28" y="84.0" fill="#251630" font-size="25" text-anchor="start" font-weight="400">One key joins the step,</text><text x="28" y="119.0" fill="#251630" font-size="25" text-anchor="start" font-weight="400">store and proxy</text><path d="M200.0 252V275" fill="none" stroke="#ac45b9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200.0 252V275" class="flow" fill="none" stroke="#7e6894" stroke-width="2"/><path d="M200.0 397V420" fill="none" stroke="#ac45b9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200.0 397V420" class="flow" fill="none" stroke="#7e6894" stroke-width="2"/><path d="M372 336H380V626H372" fill="none" stroke="#ac45b9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M372 336H380V626H372" class="flow" fill="none" stroke="#7e6894" stroke-width="2"/><rect x="28" y="130" width="344" height="122" rx="12" fill="#fdf7fe" stroke="#f3cbf7"/><text x="46" y="161.0" fill="#251630" font-size="21" text-anchor="start" font-weight="400">Caller</text><text x="46" y="213.0" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">stable logical-action key</text><rect x="28" y="275" width="344" height="122" rx="12" fill="#fdf7fe" stroke="#f3cbf7"/><text x="46" y="306.0" fill="#251630" font-size="21" text-anchor="start" font-weight="400">Wrapper / proxy</text><text x="46" y="358.0" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">first call or replay</text><rect x="28" y="420" width="344" height="122" rx="12" fill="#fdf7fe" stroke="#f3cbf7"/><text x="46" y="451.0" fill="#251630" font-size="21" text-anchor="start" font-weight="400">IdemStore</text><text x="46" y="503.0" fill="#6f5e88" font-size="17" text-anchor="start" font-weight="400">pending and committed records</text><rect x="28" y="565" width="344" height="122" rx="12" fill="#fdf7fe" stroke="#f3cbf7"/><text x="46" y="596.0" fill="#251630" font-size="21" text-anchor="start" font-weight="400">HTTP upstream</text><text x="46" y="648.0" fill="#6f5e88" font-size="17" text-a